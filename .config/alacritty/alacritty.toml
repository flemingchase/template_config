[general]
import = [
	"theme.toml",
]

working_directory = "None"
ipc_socket = false
live_config_reload = true

[env]
#WINIT_X11_SCALE_FACTOR = "1.0"

[window]
dimensions = { columns = 0, lines = 0 }
position = "None"
padding = {x = 4, y = 2 }
dynamic_padding = false
decorations = "None"
opacity = 0.8
blur = false
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = false
class = { instance = "Alacritty", general = "Alacritty" }
resize_increments = false
level = "Normal"

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "Fira Mono", style = "Regular" }
bold = { style = "Bold" }
italic = { style = "Italic" }
bold_italic = { style = "Bold Italic" }
size = 22
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }
builtin_box_drawing = true

[bell]
animation = "Linear"
duration = 0
color = "#ffffff"
command = "None"

[selection]
save_to_clipboard = true

[cursor]
style = { shape="Beam", blinking="Always" }
vi_mode_style = "None"
blink_interval = 650
blink_timeout = 0
unfocused_hollow = true
thickness = 0.15

[terminal]
#shell = "<string>"
osc52 = "CopyPaste"

[mouse]
hide_when_typing = false

[keyboard]
bindings = [
    {key="PageUp", action="None"},
    {key="PageDown",  action="None"},
    {key="Return", mods="Control|Shift", action="SpawnNewInstance"}
    ]

